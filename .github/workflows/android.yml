name: Android CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/build.log" ]]; then
            details=$(grep -E '^e: |^\* What went wrong:|^> |^FAILURE:' "$RUNNER_TEMP/build.log" | tail -30 || true)
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error::$details"
          fi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: accessible-camera-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
